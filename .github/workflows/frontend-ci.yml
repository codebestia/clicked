name: Frontend CI

on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  check:
    name: Lint · Test · Build · Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Web Crypto Tests
        run: pnpm --filter web test:crypto
        env:
          NODE_ENV: test

      - name: Build
        run: pnpm --filter web build

      - name: Check Bundle Size
        run: pnpm --filter web build:analyze
        env:
          NODE_ENV: production
          BUNDLE_SIZE_BUDGET: 512kb
